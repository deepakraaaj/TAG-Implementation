services:
  redis:
    image: redis:7.2-alpine
    container_name: tag_impl_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_HOST_PORT:-6384}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPU_LIMIT:-0.50}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    networks:
      - tag_network

  tag_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tag_impl_backend
    ports:
      - "${TAG_BACKEND_PORT:-8012}:8001"
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      APPS_CONFIG_PATH: ./config/apps.docker.yaml
      DEFAULT_CHAT_APP_ID: ${DEFAULT_CHAT_APP_ID:-vts}
      REDIS_URL: redis://redis:6379/0
      REMP_DATABASE_URL_DOCKER: ${REMP_DATABASE_URL_DOCKER}
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
      VTS_DATABASE_URL_DOCKER: ${VTS_DATABASE_URL_DOCKER}
      IMS_DATABASE_URL_DOCKER: ${IMS_DATABASE_URL_DOCKER}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./domains:/app/domains:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: ${TAG_BACKEND_HEALTHCHECK_START_PERIOD:-420s}
    restart: unless-stopped
    mem_limit: ${TAG_BACKEND_MEMORY_LIMIT:-1g}
    cpus: ${TAG_BACKEND_CPU_LIMIT:-1.00}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    networks:
      - tag_network

  chatbot_demo:
    build:
      context: ../ChatBot-Widget
      dockerfile: Dockerfile
      args:
        VITE_AI_BACKEND_URL: ${CHATBOT_DEMO_BACKEND_URL:-/api}
    container_name: kritibot_demo
    ports:
      - "${CHATBOT_DEMO_PORT:-5174}:80"
    depends_on:
      tag_backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: ${CHATBOT_DEMO_MEMORY_LIMIT:-256m}
    cpus: ${CHATBOT_DEMO_CPU_LIMIT:-0.50}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    networks:
      - tag_network

networks:
  tag_network:
    driver: bridge

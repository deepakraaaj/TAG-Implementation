services:
  redis:
    image: redis:7.2-alpine
    container_name: tag_impl_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_HOST_PORT:-6384}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - tag_network

  tag_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tag_impl_backend
    ports:
      - "${TAG_BACKEND_PORT:-8012}:8001"
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      APPS_CONFIG_PATH: ./config/apps.docker.yaml
      DEFAULT_CHAT_APP_ID: ${DEFAULT_CHAT_APP_ID:-vts}
      REDIS_URL: redis://redis:6379/0
      FITS_DATABASE_URL_DOCKER: ${FITS_DATABASE_URL_DOCKER}
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      VTS_DATABASE_URL_DOCKER: ${VTS_DATABASE_URL_DOCKER}
      IMS_DATABASE_URL_DOCKER: ${IMS_DATABASE_URL_DOCKER}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - tag_network

  chatbot_demo:
    build:
      context: ../ChatBot-Widget
      dockerfile: Dockerfile
      args:
        VITE_AI_BACKEND_URL: /api
    container_name: kritibot_demo
    ports:
      - "${CHATBOT_DEMO_PORT:-5174}:80"
    depends_on:
      tag_backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - tag_network

networks:
  tag_network:
    driver: bridge

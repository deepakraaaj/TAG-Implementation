# Multi-app database configuration
# Concrete connection strings come from environment variables.

apps:
  vts:
    display_name: "VTS - Fleet & Trip Tracking"
    name: "vts"
    domain: "vts"
    description: "Vehicle Tracking System - Fleet and trip-tracking database"
    database_url: "${VTS_DATABASE_URL}"
    login_from:
    - VTSDMS
    - VTSAPP
    - ALSVTS
    default_metadata:
      company_id: 56942673
    allow_mutations: false
    require_select_where: true
    # VTS mints a jjwt HS512 token: the signing secret is base64-encoded, claim
    # *values* (userId/companyId/authorities/...) are base64 (Transformer), and
    # roles live in `authorities` as a base64 CSV. Tenant is the plaintext
    # `loginFrom` claim (VTSDMS -> vts via the aliases above).
    auth:
      enforce: true
      secret_env: VTS_JWT_SECRET
      secret_encoding: base64
      algorithms: [HS512, HS256]
      tenant_claim: loginFrom
      user_id_claim: userId
      company_id_claim: companyId
      company_name_claim: companyName
      roles_claim: authorities
      roles_format: csv
      claim_value_encoding: base64
      user_name_claim: sub

  ims:
    display_name: "IMS - Inventory Management"
    name: "ims"
    domain: "ims"
    description: "Inventory Management System database"
    database_url: "${IMS_DATABASE_URL}"
    default_metadata:
      company_id: null
    allow_mutations: false
    require_select_where: true

  hzl:
    display_name: "HZL - Manufacturing"
    name: "hzl"
    domain: "hzl"
    description: "Heavy Industries Manufacturing database"
    database_url: "${HZL_DATABASE_URL}"
    default_metadata:
      company_id: null
    allow_mutations: false
    require_select_where: true

  crowd:
    display_name: "Crowd Analytics"
    name: "crowd"
    domain: "crowd"
    description: "Crowd management and analytics database"
    database_url: "${CROWD_DATABASE_URL}"
    default_metadata:
      company_id: null
    allow_mutations: false
    require_select_where: true

  fits_dev_ho:
    display_name: "FITS Dev - HO"
    name: "fits_dev_ho"
    domain: "fits_dev_ho"
    description: "FITS maintenance database - Head Office"
    database_url: "${FITS_DEV_HO_DATABASE_URL}"
    default_metadata:
      company_id: null
    allow_mutations: false
    require_select_where: true

  REMP:
    display_name: "REMP"
    name: "REMP"
    domain: "REMP"
    description: "FITS maintenance database - March 9 Demo"
    database_url: "${REMP_DATABASE_URL}"
    default_metadata:
      company_id: 56942686
    allow_mutations: false
    require_select_where: true
    # FITS/REMP login tokens are minted by a shared auth service. Do not bind
    # REMP to `loginFrom: ALSISS`; that identifies the auth service. Bind to the
    # signed `appcode` claim instead (`appcode=REMP`).
    login_from: []
    auth:
      enforce: true
      secret_env: FITS_JWT_SECRET
      # FITS signs with the secret as raw UTF-8 bytes (Nimbus MACSigner over
      # secret.getBytes(UTF_8)), NOT base64-decoded. Must stay "raw".
      secret_encoding: raw
      algorithms: [HS256]
      app_claim: appcode
      tenant_claim: loginFrom
      user_id_claim: userId
      company_id_claim: cid
      company_name_claim: companyName
      roles_claim: roles
      roles_format: list
      user_name_claim: sub

  fits_dev_railway:
    display_name: "FITS Dev - Railway"
    name: "fits_dev_railway"
    domain: "fits_dev_railway"
    description: "FITS maintenance database - Railway"
    database_url: "${FITS_DEV_RAILWAY_DATABASE_URL}"
    default_metadata:
      company_id: null
    allow_mutations: false
    require_select_where: true

  ioc_dev_march_9:
    display_name: "IOC Dev - March 9"
    name: "ioc_dev_march_9"
    domain: "ioc_dev_march_9"
    description: "IOC database - March 9 Dev"
    database_url: "${IOC_DEV_MARCH_9_DATABASE_URL}"
    default_metadata:
      company_id: null
    allow_mutations: false
    require_select_where: true

# Flat app -> database mapping, keyed by the token's `loginFrom` value.
#
# The app id IS the loginFrom channel, so resolution is an exact match — no
# guessing. Add a channel with one line:   <LOGINFROM>: <database_url>
# If several channels share a DB, list each one pointing at the same URL.
#
# `domain` defaults to the app id; set it explicitly when the prompt/flow
# assets live under a different name (see VTSDMS -> vts below).
apps:
  VTSDMS:
    database_url: ${VTS_DATABASE_URL_DOCKER}
    domain: vts
  fits_dev_march_9: ${FITS_DATABASE_URL_DOCKER}
  ims: ${IMS_DATABASE_URL_DOCKER}

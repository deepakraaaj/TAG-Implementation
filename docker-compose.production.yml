services:
  redis:
    ports: []
    healthcheck:
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  tag_backend:
    env_file: !override
      - .env.production
    ports: []
    expose:
      - "8001"
    environment:
      APP_ENV: production
      LOG_JSON: "true"
      APPS_CONFIG_PATH: ${APPS_CONFIG_PATH:-./config/apps.remote.yaml}
      DEFAULT_CHAT_APP_ID: ${DEFAULT_CHAT_APP_ID}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.cerebras.ai/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-oss-120b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      VTS_DATABASE_URL: ${VTS_DATABASE_URL}
      REMP_DATABASE_URL: ${REMP_DATABASE_URL}
      IMS_DATABASE_URL: ${IMS_DATABASE_URL}
      HZL_DATABASE_URL: ${HZL_DATABASE_URL:-}
      CROWD_DATABASE_URL: ${CROWD_DATABASE_URL:-}
      FITS_DEV_HO_DATABASE_URL: ${FITS_DEV_HO_DATABASE_URL:-}
      FITS_DEV_RAILWAY_DATABASE_URL: ${FITS_DEV_RAILWAY_DATABASE_URL:-}
      IOC_DEV_MARCH_9_DATABASE_URL: ${IOC_DEV_MARCH_9_DATABASE_URL:-}
      VTS_JWT_SECRET: ${VTS_JWT_SECRET:-}
      FITS_JWT_SECRET: ${FITS_JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ALLOW_ORIGIN_REGEX: ${CORS_ALLOW_ORIGIN_REGEX:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      STRICT_STARTUP_PROBES: ${STRICT_STARTUP_PROBES:-true}
      ADMIN_DASHBOARD_ENABLED: ${ADMIN_DASHBOARD_ENABLED:-false}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      ENABLE_AUDIT_LOGGING: ${ENABLE_AUDIT_LOGGING:-false}
      SQL_MAX_LIMIT: ${SQL_MAX_LIMIT:-1000}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-30000}
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: ${TAG_BACKEND_HEALTHCHECK_START_PERIOD:-420s}

  chatbot_demo:
    depends_on:
      tag_backend:
        condition: service_healthy

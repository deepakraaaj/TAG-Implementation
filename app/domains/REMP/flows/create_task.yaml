id: create_task
name: Create Maintenance Task
version: 1
target_table: task_transaction
required_fields:
  - task_description_id
  - facility_id
  - scheduled_date
  - priority
field_map:
  task_description_id: task_description_id
  facility_id: facility_id
  scheduled_date: scheduled_date
  priority: priority
  assigned_user_id: assigned_user_id
  asset_id: asset_id
  remarks: remarks
default_fields:
  status: 0
  is_active: 1
  date_created: now_utc
  date_updated: now_utc
generated_fields:
  task_id: auto_ref:TASK_
start: start
states:
  start:
    type: system
    next: choose_task_description

  choose_task_description:
    type: menu
    prompt: "Choose task template"
    capture: task_description_id
    resolver: generic.lookup
    lookup:
      table: task_description
      value_column: id
      label_columns: [name]
      search_columns: [id, name]
      page_size: 6
      order_by: name ASC
    next: choose_facility

  choose_facility:
    type: menu
    prompt: "Choose facility"
    capture: facility_id
    resolver: generic.lookup
    lookup:
      table: facility
      value_column: id
      label_columns: [name, code]
      search_columns: [id, name, code]
      search_ignore_terms: [facility, facilities]
      page_size: 6
      order_by: name ASC
    next: enter_scheduled_date

  enter_scheduled_date:
    type: input
    input_kind: date
    prompt: "Choose scheduled date"
    capture: scheduled_date
    validator: required
    next: choose_priority

  choose_priority:
    type: menu
    prompt: "Choose priority"
    capture: priority
    options:
      - label: Low
        value: "0"
      - label: Medium
        value: "1"
      - label: High
        value: "2"
      - label: Critical
        value: "3"
    next: choose_assigned_user

  choose_assigned_user:
    type: menu
    optional: true
    prompt: "Choose assigned user (optional)"
    capture: assigned_user_id
    resolver: generic.lookup
    lookup:
      table: user
      value_column: id
      label_columns: [first_name, last_name]
      search_columns: [id, first_name, last_name]
      page_size: 6
      order_by: first_name ASC, last_name ASC
    next: choose_asset

  choose_asset:
    type: menu
    optional: true
    prompt: "Choose asset (optional)"
    capture: asset_id
    resolver: generic.lookup
    lookup:
      table: asset
      value_column: id
      label_columns: [name, code]
      search_columns: [id, name, code]
      page_size: 6
      order_by: name ASC
    next: enter_remarks

  enter_remarks:
    type: input
    optional: true
    prompt: "Add remarks (optional)"
    capture: remarks
    next: confirm

  confirm:
    type: confirmation
    prompt: "Review and confirm maintenance task"
    next: write_to_db

  write_to_db:
    type: db_write
    action: generic.create_row
    on_error: confirm
    next: done

  done:
    type: end
    message: "{last_message}"

id: update_task_status
name: Update Task Status
version: 1
target_table: task_transaction
trigger:
  type: user_request
  intent:
    - "\\bupdate\\s+task\\s+status\\b"
    - "\\bmark\\s+task\\b"
    - "\\bcomplete\\s+task\\b"
    - "\\bclose\\s+task\\b"
required_fields:
  - id
  - status
field_map:
  id: id
  status: status
  remarks: remarks
default_fields:
  date_updated: now_utc
start: start
states:
  start:
    type: system
    next: choose_task

  choose_task:
    type: menu
    prompt: "Choose task to update"
    capture: id
    resolver: generic.lookup
    lookup:
      table: task_transaction
      value_column: id
      label_columns: [task_id, status, scheduled_date, assignee]
      search_columns: [id, task_id, status, scheduled_date, assignee]
      page_size: 6
      order_by: id DESC
    next: choose_status

  choose_status:
    type: menu
    prompt: "Choose new status"
    capture: status
    options:
      - label: Pending
        value: "0"
      - label: In Progress
        value: "1"
      - label: Completed
        value: "2"
      - label: Overdue
        value: "3"
    next: enter_remarks

  enter_remarks:
    type: input
    optional: true
    prompt: "Add remarks or type skip"
    capture: remarks
    next: confirm

  confirm:
    type: confirmation
    prompt: "Review and confirm task status update"
    next: write_to_db

  write_to_db:
    type: db_write
    action: generic.update_row
    on_error: confirm
    next: done

  done:
    type: end
    message: "{last_message}"
